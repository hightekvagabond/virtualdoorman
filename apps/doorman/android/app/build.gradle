apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// Resolved in settings.gradle: the node_modules folder that actually holds
// react-native (the workspace root's, once Yarn hoists it).
def nodeModulesDir = gradle.ext.nodeModulesDir
def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")

/**
 * Maps build types to the `.env` files react-native-config bakes into the APK.
 * Must be set before dotenv.gradle is applied.
 *
 * dotenv.gradle picks the file from the *task name* (`assembleRelease` →
 * `release`). Invocations it cannot classify — `./gradlew build`, an IDE sync —
 * fall through to `defaultEnvFile`; without one it would look for a `.env` that
 * does not exist here and bake in nothing, producing an APK that crashes on
 * launch in `src/config/env.ts`. Development is the right default for those:
 * `assembleRelease`/`bundleRelease` always classify correctly.
 *
 * Build one variant at a time: dotenv reads the first task name it can
 * classify, so `./gradlew assembleDebug assembleRelease` would give both APKs
 * the development environment.
 */
project.ext.defaultEnvFile = ".env.development"
project.ext.envConfigFiles = [
    debug: ".env.development",
    release: ".env.production",
]
apply from: new File(nodeModulesDir, "react-native-config/android/dotenv.gradle")

// Belt and braces: a malformed or truncated .env file otherwise surfaces only
// as a crash on the tablet, long after a green build.
def requiredEnvKeys = ["ENV_NAME", "LOG_LEVEL"]
def missingEnvKeys = requiredEnvKeys.findAll { !project.env.containsKey(it) }
if (!missingEnvKeys.isEmpty()) {
    throw new GradleException(
        "Environment file is missing required keys: ${missingEnvKeys.join(', ')}. " +
        "Check apps/doorman/.env.development and .env.production against " +
        "apps/doorman/src/config/env.ts.")
}

/**
 * This is the configuration block to customize your React Native Android app.
 * Paths are pinned explicitly because this app lives in a Yarn workspace and
 * its dependencies are hoisted to the repo root.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives.
    root = file("../../")
    //   The folder where the react-native NPM package is.
    reactNativeDir = new File(nodeModulesDir, "react-native")
    //   The folder where the react-native Codegen package is.
    codegenDir = new File(nodeModulesDir, "@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint.
    cliFile = new File(nodeModulesDir, "react-native/cli.js")

    /* Hermes Commands */
    //   The Hermes compiler used to build the release JS bundle. Without this
    //   the plugin looks for it under `root`/node_modules (i.e. apps/doorman),
    //   which does not exist once Yarn hoists everything to the repo root, and
    //   `assembleRelease` fails with "Couldn't determine Hermesc location".
    //   `%OS-BIN%` is substituted by the plugin; the binary name is not.
    def hermescBin = isWindows ? "hermesc.exe" : "hermesc"
    hermesCommand = new File(nodeModulesDir, "hermes-compiler/hermesc/%OS-BIN%/${hermescBin}").toString()

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * Release signing. The keystore never lives in this repo: set these four
 * properties in `~/.gradle/gradle.properties` (or as ORG_GRADLE_PROJECT_*
 * environment variables) — see the README's "Release APK" section.
 * Every sideloaded update must be signed with the same keystore.
 */
def releaseSigningProps = [
    'VIRTUALDOORMAN_RELEASE_STORE_FILE',
    'VIRTUALDOORMAN_RELEASE_STORE_PASSWORD',
    'VIRTUALDOORMAN_RELEASE_KEY_ALIAS',
    'VIRTUALDOORMAN_RELEASE_KEY_PASSWORD',
]
def hasReleaseSigning = releaseSigningProps.every { project.hasProperty(it) }

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.virtualdoorman"
    buildFeatures {
        // react-native-config writes the .env values into BuildConfig fields.
        buildConfig true
    }
    defaultConfig {
        applicationId "com.virtualdoorman"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(project.property('VIRTUALDOORMAN_RELEASE_STORE_FILE'))
                storePassword project.property('VIRTUALDOORMAN_RELEASE_STORE_PASSWORD')
                keyAlias project.property('VIRTUALDOORMAN_RELEASE_KEY_ALIAS')
                keyPassword project.property('VIRTUALDOORMAN_RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Unsigned unless the release keystore properties are present; the
            // check below fails the build rather than shipping a debug-signed
            // APK that can never be updated in place.
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    // One APK to sideload, carrying every ABI in `reactNativeArchitectures`
    // (gradle.properties). Splits are off by default; stated explicitly so a
    // later per-ABI optimisation is a deliberate change, not a drift.
    // `universalApk` is intentionally absent — it only applies when splits are
    // enabled, so setting it here would just be decoration.
    splits {
        abi {
            enable false
        }
    }
}

def releaseTaskPrefixes = ["assemble", "bundle", "install", "package"]
if (!hasReleaseSigning) {
    tasks.matching { task ->
            task.name.endsWith("Release") && releaseTaskPrefixes.any { task.name.startsWith(it) }
        }
        .configureEach {
            doFirst {
                throw new GradleException(
                    "Release signing is not configured. Set ${releaseSigningProps.join(', ')} " +
                    "in ~/.gradle/gradle.properties (see README, \"Release APK\").")
            }
        }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
